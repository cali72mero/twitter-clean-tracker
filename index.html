<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐦 Twitter Clean Tracker - Generator</title>
    <style>
        :root { --primary: #00ff88; --bg: #0a0a0a; --surface: #161616; --text: #fff; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 800px; width: 100%; }
        h1 { text-align: center; margin-bottom: 0.5rem; }
        .card { background: var(--surface); border: 1px solid #333; border-radius: 16px; padding: 25px; margin-bottom: 25px; }
        select, input[type="text"] { width: 100%; background: #222; border: 1px solid #444; color: #fff; padding: 12px; border-radius: 8px; margin-bottom: 10px; box-sizing: border-box; }
        .bookmarklet-btn { display: inline-block; background: var(--primary); color: #000; padding: 15px 30px; font-weight: 800; text-decoration: none; border-radius: 50px; cursor: move; margin-bottom: 15px; }
        .copy-btn { background: transparent; border: 1px solid #888; color: #888; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
        .checkbox-wrapper { display: flex; align-items: center; gap: 10px; margin-top: 15px; cursor: pointer; padding: 10px; border-radius: 8px; }
        .checkbox-wrapper:hover { background: #222; }
        .checkbox-wrapper input { width: 20px; height: 20px; accent-color: var(--primary); }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐦 CleanTwitter Fix</h1>
        <p style="text-align: center; color: #888;">Version 2.0 (Fixed Banner Logic)</p>

        <div class="card">
            <label>User-Agent:</label>
            <select id="uaSelect" onchange="generateCode()">
                <option value="Mozilla/5.0 (iPhone; CPU iPhone OS 17_4 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.4 Mobile/15E148 Safari/604.1">📱 iPhone 15</option>
                <option value="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36">🖥️ Windows 10</option>
            </select>
            
            <label class="checkbox-wrapper">
                <input type="checkbox" id="showInfo" checked onchange="generateCode()">
                <div><span>ℹ️ Info-Banner (alle 5 Posts)</span></div>
            </label>
            
            <label class="checkbox-wrapper">
                <input type="checkbox" id="recordHistory" checked onchange="generateCode()">
                <div><span>🔴 Tweet Recorder & Download</span></div>
            </label>
        </div>

        <div class="card" style="text-align: center;">
            <a id="bookmarkletBtn" class="bookmarklet-btn" href="#">🐦 CleanTwitter V2</a>
            <br>
            <button class="copy-btn" onclick="copyCode()">📋 Code kopieren</button>
            <p id="copyStatus" style="opacity: 0; color: var(--primary); transition: 0.5s;">Kopiert!</p>
        </div>
        
        <div class="card">
            <h3>📖 Anleitung</h3>
            <p>1. Code kopieren.<br>2. Lesezeichen "CleanTwitter" bearbeiten.<br>3. Alten Code löschen, neuen einfügen.</p>
        </div>
    </div>

    <script>
        const uaSelect = document.getElementById('uaSelect');
        const showInfoCheckbox = document.getElementById('showInfo');
        const recordHistoryCheckbox = document.getElementById('recordHistory');
        const bookmarkletBtn = document.getElementById('bookmarkletBtn');

        function generateCode() {
            const ua = uaSelect.value;
            const showInfo = showInfoCheckbox.checked;
            const doRecord = recordHistoryCheckbox.checked;
            
            // Fixed Logic: Inject INTO article instead of AFTER row
            const code = `javascript:(function(){
                var ua = '${ua}';
                var showInfo = ${showInfo};
                var doRecord = ${doRecord};
                var counter = 0;
                var recorded = [];
                
                /* Spoof */
                try { Object.defineProperty(navigator, 'userAgent', {get:()=>ua}); } catch(e){}

                /* UI Helpers */
                function createOverlay(text) {
                    var d = document.createElement('div');
                    d.style.cssText = 'position:fixed; top:20px; left:50%; transform:translateX(-50%); background:#00ff88; color:#000; padding:10px 20px; border-radius:30px; z-index:9999; font-weight:bold; box-shadow:0 5px 20px rgba(0,0,0,0.3); font-family:sans-serif; pointer-events:none;';
                    d.innerText = text;
                    document.body.appendChild(d);
                    setTimeout(()=>d.remove(), 3000);
                }

                var dlBtn;
                if(doRecord) {
                    dlBtn = document.createElement('button');
                    dlBtn.innerText = '📥 0';
                    dlBtn.style.cssText = 'position:fixed; bottom:20px; right:20px; z-index:9999; background:#1da1f2; color:#fff; border:none; padding:12px 20px; border-radius:50px; font-weight:bold; cursor:pointer; font-family:sans-serif; box-shadow:0 5px 15px rgba(0,0,0,0.3);';
                    dlBtn.onclick = function(){
                        var html = '<html><head><meta charset="utf-8"><title>Twitter Log</title></head><body style="background:#111;color:#fff;font-family:sans-serif;padding:20px;"><h1>Saved Tweets ('+recorded.length+')</h1>';
                        recorded.forEach(t => html += '<div style="border:1px solid #333;margin:10px 0;padding:10px;border-radius:10px;background:#222;"><strong>'+t.user+'</strong><br>'+t.text+'<br>'+(t.img?'<img src="'+t.img+'" style="max-width:300px;margin-top:10px;border-radius:10px;">':'')+'</div>');
                        html += '</body></html>';
                        var b = new Blob([html],{type:'text/html'});
                        var a = document.createElement('a');
                        a.href = URL.createObjectURL(b);
                        a.download = 'tweets.html';
                        a.click();
                    };
                    document.body.appendChild(dlBtn);
                }

                function clean() {
                    /* Remove Ads & Skeletons */
                    document.querySelectorAll('[data-testid="skeleton"], [data-testid="PromotedTweet"], [aria-label*="Who to follow"]').forEach(el => el.remove());

                    /* Scan Tweets */
                    document.querySelectorAll('article[data-testid="tweet"]').forEach(tweet => {
                        if(tweet.getAttribute('data-scanned')) return;
                        tweet.setAttribute('data-scanned', 'true');
                        
                        counter++;
                        
                        /* Banner Logic - Inject INSIDE article at bottom */
                        if(showInfo && counter % 5 === 0) {
                            var banner = document.createElement('div');
                            banner.style.cssText = 'background:rgba(0,255,136,0.1); border:1px dashed #00ff88; color:#00ff88; text-align:center; padding:5px; margin-top:10px; border-radius:8px; font-size:12px; font-family:monospace;';
                            banner.innerHTML = '🛡️ CleanTwitter: ' + counter + ' Posts checked';
                            // Append to the tweet's content container usually
                            tweet.appendChild(banner);
                        }

                        /* Recording Logic */
                        if(doRecord) {
                            var txtEl = tweet.querySelector('[data-testid="tweetText"]');
                            var userEl = tweet.querySelector('[data-testid="User-Name"]');
                            var imgEl = tweet.querySelector('img[src*="media"]');
                            
                            if(txtEl || imgEl) {
                                recorded.push({
                                    user: userEl ? userEl.innerText.split('\\n')[0] : 'Unknown',
                                    text: txtEl ? txtEl.innerText : '',
                                    img: imgEl ? imgEl.src : null
                                });
                                if(dlBtn) dlBtn.innerText = '📥 ' + recorded.length;
                            }
                        }
                    });
                }

                setInterval(clean, 1500);
                createOverlay('🐦 CleanTwitter Started!');
            })();`.replace(/\s+/g, ' ').trim();

            bookmarkletBtn.setAttribute('href', code);
        }

        function copyCode() {
            navigator.clipboard.writeText(bookmarkletBtn.getAttribute('href')).then(() => {
                const s = document.getElementById('copyStatus'); s.style.opacity = '1'; setTimeout(() => s.style.opacity='0', 2000);
            });
        }
        
        generateCode();
    </script>
</body>
</html>
